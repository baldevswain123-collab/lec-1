<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Try, Catch & Finally</h1>

    <script>
        //To generate a custom eroor 
        class AppError extends Error{
            constructor(msg){
                super(msg)
            }
        }
        // end custom error


        try{
            //error generating code 
            console.log("Try blobck is executing :-1");
            // abc()// simple error
            // throw new Error("This is a custom error generation") //it is manually error created and custom error generated
            throw new AppError("Custom Error class") //it is manually custom error class
            console.log("Try blobck is executing :-2");


        }catch(err){
            //to handle the error generated inside try block
            console.log("Catch block is executed",err);
            
        }finally{
            //This block will always be executed regardless of execution generated or not
            console.log("Finally block is executed");
            
        }
    </script>
</body>
</html>
